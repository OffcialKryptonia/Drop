<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Drop Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Signed-out screens -->
  <main id="authWrap">
    <section id="login" class="card" hidden>
      <h2>Sign in</h2>
      <p class="muted">Administrator account only.</p>
      <form id="loginForm" autocomplete="on">
        <label class="f" for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label class="f" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p id="loginMsg" class="msg"></p>
        <p style="margin:16px 0 0"><button type="submit" id="loginBtn" style="width:100%">Sign in</button></p>
      </form>
      <p class="muted" style="margin-top:16px"><a href="#setup" id="setupLink">First-time setup</a></p>
    </section>

    <section id="setup" class="card" hidden>
      <h2>Create the first admin</h2>
      <p class="muted">Needs the setup code you saved in Cloudflare as <b>ADMIN_BOOTSTRAP_TOKEN</b>. It works only until the first admin exists.</p>
      <form id="setupForm" autocomplete="off">
        <label class="f" for="s_token">Setup code</label><input id="s_token" type="password" required>
        <label class="f" for="s_first">First name</label><input id="s_first" required>
        <label class="f" for="s_last">Last name</label><input id="s_last" required>
        <label class="f" for="s_user">Username</label><input id="s_user" required minlength="3">
        <label class="f" for="s_email">Email</label><input id="s_email" type="email" required>
        <label class="f" for="s_pass">Password (10+ characters)</label><input id="s_pass" type="password" required minlength="10" autocomplete="new-password">
        <p id="setupMsg" class="msg"></p>
        <p style="margin:16px 0 0"><button type="submit" style="width:100%">Create admin</button></p>
      </form>
      <p class="muted" style="margin-top:16px"><a href="#" id="backLogin">Back to sign in</a></p>
    </section>
  </main>

  <!-- Signed-in app -->
  <div id="app" hidden>
    <div class="scrim" id="scrim"></div>
    <nav class="side" id="side" aria-label="Main">
      <div class="brand"><div class="mark">D</div> Drop Admin</div>
      <div id="navLinks"></div>
      <div class="who" id="who"></div>
      <p style="margin:12px 8px 0"><button class="ghost small" id="logout">Sign out</button></p>
    </nav>
    <div class="shell">
      <header class="top">
        <button class="icon-btn" id="menuBtn" aria-label="Open menu">Menu</button>
        <h1 id="title">Drop Admin</h1>
      </header>
      <main id="page"></main>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
