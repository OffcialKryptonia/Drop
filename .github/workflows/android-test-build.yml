name: Android test build

# Run from the Actions tab (works from the GitHub mobile site). Builds a debug APK signed with the test key
# and publishes it as a pre-release you can download straight onto an Android phone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/drop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter 3.50 needs Gradle 9.3.1, but this project's Android setup (Gradle 8.14, AGP 8.11) is on 3.47.
          # Move to 3.50 only together with a Gradle/AGP upgrade.
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Fingerprints of the test key
        run: |
          keytool -list -v -keystore android/test-keystore/drop-test.jks -alias droptest -storepass droptest123 | grep -E "SHA1|SHA256" | tee fingerprints.txt
          {
            echo "### Test key fingerprints (add the SHA-1 to your Google Maps Android key)"
            echo '```'
            cat fingerprints.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the repository secret GOOGLE_SERVICES_JSON (the contents of google-services.json for com.kryptonia.drop)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Google Maps key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -n "$MAPS_KEY" ]; then
            sed -i "s|ADD_YOUR_GOOGLE_MAP_KEY_ANDROID_HERE|$MAPS_KEY|" android/app/src/main/AndroidManifest.xml
          else
            echo "::warning::No GOOGLE_MAPS_ANDROID_KEY secret: the passenger map will be blank."
          fi

      - name: Signing config
        run: |
          cat > android/key.properties <<EOF
          storePassword=droptest123
          keyPassword=droptest123
          keyAlias=droptest
          storeFile=../test-keystore/drop-test.jks
          EOF

      # Gradle cannot install the NDK until the Android SDK licences are accepted.
      - name: Accept Android licences and install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*cmdline-tools*' 2>/dev/null | head -n 1)"
          fi
          echo "SDK root: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;29.0.13113456"

      - run: flutter pub get

      # GitHub's download server sometimes answers 504 when Gradle is fetched, so a failed build is retried (3 attempts).
      - name: Build APK
        run: |
          for i in 1 2 3; do
            if flutter build apk --debug; then exit 0; fi
            echo "Build attempt $i failed, waiting before retrying..."
            sleep 45
          done
          exit 1

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          TAG="test-${{ github.run_number }}"
          cp apps/drop/build/app/outputs/flutter-apk/app-debug.apk "drop-test-${{ github.run_number }}.apk"
          gh release create "$TAG" "drop-test-${{ github.run_number }}.apk" --prerelease --title "Test build ${{ github.run_number }}" --notes "Internal DEBUG test APK signed with the test key. Not for the Play Store."
