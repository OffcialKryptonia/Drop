name: Build Drop Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/driver-map
    paths:
      - "apps/drop/**"
      - ".github/workflows/drop-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Drop
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" SDK package has been removed by Google.
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
          cache-dependency-path: apps/drop/pubspec.lock

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.13113456"

      - name: Restore Firebase Android configuration
        working-directory: apps/drop
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.kryptonia.drop")' android/app/google-services.json > /dev/null

      - name: Get Flutter dependencies
        working-directory: apps/drop
        run: flutter pub get

      - name: Build debug APK
        working-directory: apps/drop
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drop-debug-apk
          path: apps/drop/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
