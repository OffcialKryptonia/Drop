name: Drop Mapbox integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/drop/**"
      - "worker/**"
      - ".github/workflows/drop-mapbox-ci.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/drop
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Configure Firebase for Android build
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if [ -n "$GOOGLE_MAPS_ANDROID_KEY" ]; then
            sed -i "s|ADD_YOUR_GOOGLE_MAP_KEY_ANDROID_HERE|$GOOGLE_MAPS_ANDROID_KEY|" android/app/src/main/AndroidManifest.xml
          fi
      - name: Android debug APK build
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: flutter build apk --debug
      - name: Android build skipped (Firebase secret not configured)
        if: ${{ env.GOOGLE_SERVICES_JSON == '' }}
        run: echo "GOOGLE_SERVICES_JSON is not configured; Flutter analysis and tests ran, but Android APK build was skipped."

  worker:
    name: Worker TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
