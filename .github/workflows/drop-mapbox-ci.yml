name: Drop Mapbox integration checks

on:
  push:
    branches: [feat/flutter-multi-stop-routes, feat/ride-chat, feat/ride-calls, feat/optional-fare-bidding, feat/instant-offline-first, feat/theme-light-dark-compass, feat/airport-infrastructure, feat/airport-booking-driver, feat/push-templates, chore/apk-size-and-legacy-driver, feat/email-templates, feat/ops-command-center]
  pull_request:
    branches: [main]
    paths:
      - "apps/drop/**"
      - "worker/**"
      - ".github/workflows/drop-mapbox-ci.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/drop
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test
      - name: Accept Android SDK licences and install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*cmdline-tools*' 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;29.0.13113456"
      - name: Configure Firebase for Android build
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if [ -n "$GOOGLE_MAPS_ANDROID_KEY" ]; then
            sed -i "s|ADD_YOUR_GOOGLE_MAP_KEY_ANDROID_HERE|$GOOGLE_MAPS_ANDROID_KEY|" android/app/src/main/AndroidManifest.xml
          fi
      - name: Free runner disk space before the Android build
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          df -h / | tail -1
      - name: Android debug APK build
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        # One ABI keeps the runner within disk limits now that calling adds large native libraries.
        # Maven Central sometimes answers "429 Too Many Requests" while Gradle downloads plugins; that is a network
        # hiccup, not a code error, so try up to 3 times with a pause before failing.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --target-platform android-arm64; then exit 0; fi
            echo "::warning::Android build attempt $attempt failed; retrying after a pause"
            sleep $((attempt * 45))
          done
          exit 1
      - name: Disk and memory after the Android build
        if: ${{ always() && env.GOOGLE_SERVICES_JSON != '' }}
        run: df -h / | tail -1; free -m | head -2
      - name: Android build skipped (Firebase secret not configured)
        if: ${{ env.GOOGLE_SERVICES_JSON == '' }}
        run: echo "GOOGLE_SERVICES_JSON is not configured; Flutter analysis and tests ran, but Android APK build was skipped."

  worker:
    name: Worker TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Pickup code unit tests
        run: npx --yes tsx test/pickup.test.ts
      - name: Receipt unit tests
        run: npx --yes tsx test/receipt.test.ts
      - name: Chat unit tests
        run: npx --yes tsx test/chat.test.ts
      - name: Call token unit tests
        run: npx --yes tsx test/calls.test.ts
      - name: Fare bidding unit tests
        run: npx --yes tsx test/bidding.test.ts
      - name: Admin light/dark theme checks
        run: npx --yes tsx test/admin-theme.test.ts
      - name: Push template unit tests
        working-directory: worker
        run: npx --yes tsx test/push-templates.test.ts
      - name: Email template unit tests
        working-directory: worker
        run: npx --yes tsx test/email-templates.test.ts
      - name: Dispatch and operations unit tests
        working-directory: worker
        run: npx --yes tsx test/dispatch.test.ts
      - name: Ride-flow smoke test syntax
        run: node --check test/rides-trip-smoke.mjs
